name: Build WristPane

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Select Xcode and install XcodeGen
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen version

      - name: Check FlareStore source generation
        run: python3 -m unittest discover -s Tests -p 'test_*.py'

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile iPhone app and embedded Watch app
        run: |
          set -o pipefail
          mkdir -p build/logs build/artifacts
          xcodebuild \
            -project WristPane.xcodeproj \
            -scheme WristPane \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="0.1.${GITHUB_RUN_NUMBER}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build 2>&1 | tee build/logs/iphone.log | tail -n 120

      - name: Compile native watchOS target
        run: |
          set -o pipefail
          xcodebuild \
            -project WristPane.xcodeproj \
            -scheme WristPaneWatch \
            -configuration Release \
            -destination 'generic/platform=watchOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="0.1.${GITHUB_RUN_NUMBER}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build 2>&1 | tee build/logs/watch.log | tail -n 120

      - name: Verify embedded Watch and WidgetKit bundles
        run: |
          set -euo pipefail
          ios_app='build/DerivedData/Build/Products/Release-iphoneos/WristPane.app'
          test -d "$ios_app"
          find "$ios_app" -type d \( -name 'WristPaneWatch.app' -o -name 'WristPaneWatchWidgets.appex' \) | sort | tee build/logs/embedded-bundles.txt
          # Xcode 26+ embeds single-target watchOS apps as Foundation extensions.
          # Embedding them in Watch/ instead of PlugIns/ fails validation.
          watch_app="$ios_app/PlugIns/WristPaneWatch.app"
          widgets="$watch_app/PlugIns/WristPaneWatchWidgets.appex"
          test -d "$watch_app"
          test -d "$widgets"
          # Both apps must compile their own named AppIcon asset catalog.
          # A successful Swift compilation alone does not catch missing icons.
          test -s "$ios_app/Assets.car"
          test -s "$watch_app/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$ios_app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$watch_app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$widgets/Info.plist"

          # Windows Apple-ID sideloaders expect an IPA whose root is Payload/.
          # This is intentionally UNsigned. A local installer must provision and
          # sign the iPhone app, Watch app, and Watch widget extension separately.
          mkdir -p build/package/Payload
          ditto "$ios_app" build/package/Payload/WristPane.app
          ditto -c -k --sequesterRsrc --keepParent build/package/Payload build/artifacts/WristPane-unsigned.ipa
          unzip -Z1 build/artifacts/WristPane-unsigned.ipa > build/logs/ipa-entries.txt
          grep -Fxq 'Payload/WristPane.app/Info.plist' build/logs/ipa-entries.txt
          grep -Fxq 'Payload/WristPane.app/PlugIns/WristPaneWatch.app/Info.plist' build/logs/ipa-entries.txt
          grep -Fxq 'Payload/WristPane.app/PlugIns/WristPaneWatch.app/PlugIns/WristPaneWatchWidgets.appex/Info.plist' build/logs/ipa-entries.txt
          ditto -c -k --sequesterRsrc --keepParent "$ios_app" build/artifacts/WristPane-unsigned-app.zip
          (cd build/artifacts && shasum -a 256 WristPane-unsigned.ipa WristPane-unsigned-app.zip > SHA256SUMS.txt)

      - name: Upload compilation artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WristPane-unsigned-${{ github.run_number }}
          path: |
            build/artifacts/
            build/logs/
          retention-days: 30
          if-no-files-found: warn

      - name: Publish unsigned archive on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s build/artifacts/WristPane-unsigned.ipa
          gh release create "${GITHUB_REF_NAME}" \
            build/artifacts/WristPane-unsigned.ipa \
            build/artifacts/WristPane-unsigned-app.zip \
            build/artifacts/SHA256SUMS.txt \
            --title "WristPane ${GITHUB_REF_NAME} (unsigned)" \
            --notes "Unsigned iPhone + embedded Apple Watch companion IPA for local signing experiments. NOT directly installable: iPhone, Watch, and WidgetKit extension each need appropriate signing and provisioning."

      - name: Prepare FlareStore feed for the completed IPA
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/update_source.py

      - name: Publish downloadable IPA to GitHub Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wristpane-build.${{ github.run_number }}
          name: WristPane 0.1.${{ github.run_number }} (unsigned)
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Automatic WristPane development build for iOS 27 and watchOS 27.
            The IPA includes an iPhone app, embedded Watch companion and Watch widgets.
            This IPA is UNSIGNED. A FlareStore source is a download catalog, not a
            guarantee that an iPhone-only certificate can sign or install the Watch app.
            The iPhone app, Watch app and WidgetKit extension need suitable profiles.
          files: |
            build/artifacts/WristPane-unsigned.ipa
            build/artifacts/WristPane-unsigned-app.zip
            build/artifacts/SHA256SUMS.txt

      - name: Update source.json after successful GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git add source.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "Update FlareStore source for WristPane build ${{ github.run_number }} [skip ci]"
            git push origin HEAD:main
          fi

  # The validated third-party Windows proof of concept recognizes legacy Watch/
  # bundles only. Xcode 27 must embed single-target watchOS apps in PlugIns/.
  # Build a local-use installer with both layouts supported, without committing
  # or sending any signing credentials to GitHub. Device installation is UNTESTED.
  build-windows-watch-installer:
    name: Experimental Windows Watch installer
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - name: Check out physically tested iLoader revision
        uses: actions/checkout@v4
        with:
          repository: Rzbck/iloader
          ref: 70f37e9b4afc659ab44ec1944c034093f4cda416
          path: installer/iloader
          persist-credentials: false

      - name: Check out matching isideload backend
        uses: actions/checkout@v4
        with:
          repository: Rzbck/isideload
          ref: f7b9f3da570edd6824c29680545e710846d07df5
          path: installer/isideload
          persist-credentials: false

      - name: Teach the backend to recognize modern PlugIns Watch companions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          bundle = Path('installer/isideload/isideload/src/sideload/bundle.rs')
          source = bundle.read_text(encoding='utf-8')
          anchor = '        let libraries = find_dylibs(&bundle_path, &bundle_path)?;'
          assert source.count(anchor) == 1, 'Upstream backend changed; review the patch'
          replacement = '''        // Xcode 26+ embeds single-target Watch apps as Foundation extensions in
                  // PlugIns/, while older projects use Watch/. Keep both paths.
                  let mut app_extensions = app_extensions;
                  let mut watch_apps = watch_apps;
                  app_extensions.retain(|child| {
                      if child.bundle_dir.extension().is_some_and(|ext| ext == "app")
                          && child.app_info.contains_key("WKCompanionAppBundleIdentifier")
                      {
                          watch_apps.push(child.clone());
                          false
                      } else {
                          true
                      }
                  });

          '''
          source = source.replace(anchor, replacement + anchor)
          bundle.write_text(source, encoding='utf-8')

          manifest = Path('installer/iloader/src-tauri/Cargo.toml')
          text = manifest.read_text(encoding='utf-8')
          before = [line for line in text.splitlines() if line.startswith('isideload = ')]
          assert len(before) == 1, 'Expected one isideload dependency'
          text = text.replace(before[0], 'isideload = { path = "../../isideload/isideload", features = ["fs-storage"] }')
          manifest.write_text(text, encoding='utf-8')
          print('Applied PlugIns Watch recognition and local isideload dependency')
          PY

      - name: Configure Windows Rust and WebView toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Perl and Make
        run: choco install strawberryperl make --no-progress

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: installer/iloader
        run: bun i --frozen-lockfile

      - name: Build unsigned Windows installer
        working-directory: installer/iloader
        run: bun tauri build --config src-tauri/ci.conf.json --bundles nsis

      - name: Upload local-use experimental installer
        uses: actions/upload-artifact@v4
        with:
          name: WristPane-Windows-Watch-Installer-${{ github.run_number }}
          path: installer/iloader/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: error
